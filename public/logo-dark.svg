  <line x1="8" y1="19" x2="18" y2="19" stroke="#818cf8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="8" y1="26" x2="18" y2="26" stroke="#818cf8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="8" y1="33" x2="14" y2="33" stroke="#818cf8" stroke-width="1.6" stroke-linecap="round"/>

